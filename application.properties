# Exposes the standard network port Render requires to route web traffic
server.port=${PORT:8080}

# Automatically switches database drivers between local MySQL and Render's Cloud PostgreSQL
spring.datasource.url=jdbc:postgresql://${DATABASE_URL_PARSED}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keeps your tables up to date automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
